# QuickProof configuration of wireguard-auto-proofs (quickproof/tools/clight.sh): the library units, then one unit
# per harness/*.c.
#
# Code under test: the WireGuard handshake (noise.c, cookie.c), the two receive.c functions of the data path that
# model to Clight -- the replay window (patch/counter_validate.c, byte for byte: S19) and the data-packet length
# gate (patch/data_header.c, a reduction: S24) -- and the generic C of the primitives they call, in the
# configuration of an architecture without arch-optimised crypto and without __int128 (CompCert has neither):
#   BLAKE2s: blake2s.c with blake2s_compress_generic (no CONFIG_CRYPTO_LIB_BLAKE2S_ARCH);
#   ChaCha20: chacha.c + chacha-block-generic.c (no CONFIG_CRYPTO_LIB_CHACHA_ARCH);
#   Poly1305: poly1305.c + poly1305-donna32.c (the 32-bit limb variant; x86_64 kernels build donna64, which
#             needs __int128; CONFIG_CRYPTO_LIB_POLY1305_RSIZE=1 as for the generic code);
#   Curve25519: curve25519.c + curve25519-fiat32.c (x86_64 kernels build hacl64, which needs __int128, or the
#             ADX assembly);
#   ChaCha20-Poly1305 and XChaCha20-Poly1305: chacha20poly1305.c (the scatterlist functions compiled out).
# The kernel environment is the shim: patch/include (headers found before any system header) and
# patch/wg_shim.c.  See DEVIATIONS.md for every difference from a kernel build.
INC=(-Ipatch/include -Idrivers/net/wireguard -Iinclude -Iquickproof/include -isystem "$(gcc -print-file-name=include)")
DEFS=(-DCONFIG_CRYPTO_LIB_POLY1305_RSIZE=1)
UNITS=(
  "drivers/net/wireguard/noise.c=src/noise"
  "drivers/net/wireguard/cookie.c=src/cookie"
  "patch/counter_validate.c=src/counter"
  "patch/data_header.c=src/data_header"
  "lib/crypto/blake2s.c=src/blake2s"
  "lib/crypto/chacha.c=src/chacha"
  "lib/crypto/chacha-block-generic.c=src/chacha_block"
  "lib/crypto/poly1305.c=src/poly1305"
  "lib/crypto/poly1305-donna32.c=src/poly1305_donna32"
  "lib/crypto/chacha20poly1305.c=src/chacha20poly1305"
  "lib/crypto/curve25519.c=src/curve25519"
  "lib/crypto/curve25519-fiat32.c=src/curve25519_fiat32"
  "patch/wg_shim.c=src/shim"
  "$GP/libc/libc.c=src/libc"
  "$GP/libc/malloc_unit.c=src/malloc"
)

# one unit per harness/*.c
UNITS+=(
  "harness/ae_fail_untouched.c=src/harness/ae_fail_untouched"
  "harness/ae_roundtrip.c=src/harness/ae_roundtrip"
  "harness/ae_split_blake2s.c=src/harness/ae_split_blake2s"
  "harness/ae_split_chacha20.c=src/harness/ae_split_chacha20"
  "harness/ae_split_poly1305.c=src/harness/ae_split_poly1305"
  "harness/ae_xroundtrip.c=src/harness/ae_xroundtrip"
  "harness/hs_begin_session_state.c=src/harness/hs_begin_session_state"
  "harness/hs_matching_keys.c=src/harness/hs_matching_keys"
  "harness/hs_reject_initiation.c=src/harness/hs_reject_initiation"
  "harness/hs_reject_response.c=src/harness/hs_reject_response"
  "harness/hs_replay_initiation.c=src/harness/hs_replay_initiation"
  "harness/hs_response_state.c=src/harness/hs_response_state"
  "harness/hs_session_erases.c=src/harness/hs_session_erases"
  "harness/hs_stale_response.c=src/harness/hs_stale_response"
  "harness/rp_any_order.c=src/harness/rp_any_order"
  "harness/rp_duplicate.c=src/harness/rp_duplicate"
  "harness/rp_fresh.c=src/harness/rp_fresh"
  "harness/rp_limit.c=src/harness/rp_limit"
  "harness/rp_too_old.c=src/harness/rp_too_old"
  "harness/x_config_any.c=src/harness/x_config_any"
  "harness/x_consume_initiation_any.c=src/harness/x_consume_initiation_any"
  "harness/x_consume_response_any.c=src/harness/x_consume_response_any"
  "harness/x_cookie_mac.c=src/harness/x_cookie_mac"
  "harness/x_cookie_reply.c=src/harness/x_cookie_reply"
  "harness/x_counter.c=src/harness/x_counter"
  "harness/x_create_any.c=src/harness/x_create_any"
  "harness/x_handshake.c=src/harness/x_handshake"
  "harness/x_handshake_clear.c=src/harness/x_handshake_clear"
  "harness/x_handshake_receive.c=src/harness/x_handshake_receive"
  "harness/x_keypairs.c=src/harness/x_keypairs"
  "harness/x_prim_aead.c=src/harness/x_prim_aead"
  "harness/x_prim_blake2s.c=src/harness/x_prim_blake2s"
  "harness/x_prim_poly1305.c=src/harness/x_prim_poly1305"
  "harness/x_prim_x25519.c=src/harness/x_prim_x25519"
  "harness/x_replay.c=src/harness/x_replay"
  "harness/x_transport_keepalive.c=src/harness/x_transport_keepalive"
  "harness/x_transport_len.c=src/harness/x_transport_len"
  "harness/x_transport_order.c=src/harness/x_transport_order"
  "harness/x_transport_send_nonce.c=src/harness/x_transport_send_nonce"
)

# Linking (docs/LINKING.md of the framework): each law's program links the library units listed for it, in the
# order of UNITS.  The four transport laws link all 15; the other laws link all but patch/data_header.c, which
# only the transport laws reach.
LINK=per-law
UNITS_x_config_any=(src/noise src/cookie src/counter src/blake2s src/chacha src/chacha_block src/poly1305 src/poly1305_donna32 src/chacha20poly1305 src/curve25519 src/curve25519_fiat32 src/shim src/libc src/malloc)
